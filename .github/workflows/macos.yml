name: macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install pkg-config
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: sdl3-macos-${{ hashFiles('scripts/build_sdl.sh') }}
      - run: |
          [ -d build/deps/sdl3 ] || scripts/build_sdl.sh
      - run: scripts/build_mac_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: byte-macos-universal
          path: build/byte-macos-universal.zip
